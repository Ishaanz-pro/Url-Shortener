version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shortener_db
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener_pass
      POSTGRES_DB: url_shortener_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shortener_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  web:
    build: .
    container_name: shortener_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://shortener:shortener_pass@postgres:5432/url_shortener_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DEBUG: "False"
      ENVIRONMENT: production
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: .
    container_name: shortener_celery
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://shortener:shortener_pass@postgres:5432/url_shortener_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: production
    volumes:
      - .:/app
    command: celery -A app.workers.tasks worker --loglevel=info

  celery-beat:
    build: .
    container_name: shortener_celery_beat
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://shortener:shortener_pass@postgres:5432/url_shortener_db
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: production
    volumes:
      - .:/app
    command: celery -A app.workers.tasks beat --loglevel=info

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: shortener_network
